<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1f33">
  <meta name="robots" content="noindex">
  <title>المعلّم النجم</title>
  <link rel="preload" href="/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/noto-kufi-arabic-arabic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pixel.css">
</head>
<body class="px">
  <canvas id="screen" aria-label="لعبة بكسل: شارع الخليج وقت الغروب وأبراج الكويت"></canvas>
  <div id="labels" class="px-labels"></div>
  <div class="crt" aria-hidden="true"></div>

  <header class="px-hud">
    <div><span class="px-num" id="hud-score">0000</span><small id="hud-school">نقاط</small></div>
    <div class="mid"><span class="px-num" id="hud-stage">KW 1-1</span><small id="hud-stage-name">شارع الخليج</small><span class="px-cards" id="hud-cards" role="status"></span></div>
    <div><span class="px-num" id="hud-time">00:00</span><small><a href="/?quick=1">تصويت سريع</a></small><button class="px-snd" id="snd" type="button" aria-pressed="true">الصوت: يعمل</button></div>
  </header>

  <div class="px-title" id="title" hidden>
    <p class="px-kicker">مبادرة معلّمي المفضّل</p>
    <h1>المعلّم النجم</h1>
    <p class="px-start">اضغط للبدء</p>
  </div>

  <div class="px-board" id="board" hidden aria-live="polite"></div>
  <div class="px-raceq" id="raceq" hidden aria-live="polite"></div>
  <div class="px-words" id="words" hidden aria-live="polite"></div>
  <section class="px-dlg" id="dlg" hidden aria-live="polite"></section>

  <div class="px-pad" id="pad" hidden>
    <button class="px-key" id="pad-right" type="button" aria-label="امشِ يميناً" dir="ltr">▶</button>
    <button class="px-key a" id="pad-a" type="button" aria-label="زر الاختيار">A</button>
    <button class="px-key" id="pad-left" type="button" aria-label="امشِ يساراً" dir="ltr">◀</button>
  </div>

  <div class="px-pbook" id="pbook" hidden></div>

  <div class="px-clear" id="clear" hidden>
    <p class="px-num big">STAGE CLEAR</p>
    <h2>أضأت نجم <span id="clear-name"></span></h2>
    <p id="clear-sub"></p>
    <p class="px-num">SCORE <span id="clear-score">0000</span></p>
    <a class="px-btn" href="/about">عن المبادرة</a>
  </div>

  <div class="px-loading" id="loading"><span class="px-num">LOADING…</span></div>
  <script type="module" src="/js/pixel/game.js"></script>
</body>
</html>
